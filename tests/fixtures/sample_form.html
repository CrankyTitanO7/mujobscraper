<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Acme</title>
  </head>
  <body>
    <main>
      <h1>Machine Learning Intern</h1>
      <form>
        <input type="hidden" name="csrf" value="secret" />
        <p>
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" type="text" required />
        </p>
        <p>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required />
        </p>
        <p>
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" />
        </p>
        <p>
          <label for="resume">Upload your resume</label>
          <input id="resume" name="resume" type="file" />
        </p>
        <fieldset>
          <legend>Are you authorized to work in the United States?</legend>
          <label><input type="radio" name="work_auth" value="yes" /> Yes</label>
          <label><input type="radio" name="work_auth" value="no" /> No</label>
        </fieldset>
        <p>
          <label for="sponsorship">Will you now or in the future require sponsorship?</label>
          <select id="sponsorship" name="sponsorship">
            <option value="">Select…</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </p>
        <p>
          <label for="why">Why are you interested in this role?</label>
          <textarea id="why" name="why" rows="5"></textarea>
        </p>
        <p>
          <label><input type="checkbox" name="relocate" /> Are you willing to relocate?</label>
        </p>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
