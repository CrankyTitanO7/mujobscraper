[project]
name = "jobscraper"
version = "0.1.0"
description = "Assisted, AI-powered job discovery, question answering, and application autofill."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.28.1",
    "playwright>=1.50.0",
    "pydantic>=2.10.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[project.scripts]
jobscraper = "jobscraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises a real browser and local Chromium installation",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
